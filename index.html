<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊盒">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="桌遊盒 — 幾部手機變成一盒桌遊：開房、派牌、旁白、投票、計分">
<title>🎲 桌遊盒</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" href="icon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg?v=1">
<link rel="stylesheet" href="css/base.css?v=1">
</head>
<body>

<!-- Everything inside #app is built by js/main.js. This splash is what shows
     while the modules download, and what is left if they never do. -->
<div id="app">
  <div class="boot" id="boot">
    <div class="boot-emoji">🎲</div>
    <div>桌遊盒載入緊…</div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="netbar hidden" id="netbar" role="alert"></div>

<!-- PeerJS signalling client (multi-phone rooms). async, so a slow or blocked CDN
     never delays the first paint or one-phone play; the shell waits for it
     (sh.whenPeer) only when someone taps 開房 / 入房. -->
<script id="peerjs" src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" async
        onload="this.dataset.s='ok'" onerror="this.dataset.s='fail'"></script>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
